services:
  mysql:
    image: mysql:5.7
    container_name: lafazenda_sync_mysql # nombre de referencia del servicio
    command: --default-authentication-plugin=mysql_native_password --bind-address=0.0.0.0
    ports:
      - 33061:3306
    volumes:
      - ./.volumes/mysql:/var/lib/mysql # carpeta local:carpeta de config de mysql
    environment:
      MYSQL_DATABASE: cebra_fazenda_integration
      MYSQL_USER: user_cebra_fazenda
      MYSQL_PASSWORD: admin_cebra_fazenda_integration
      MYSQL_ROOT_PASSWORD: admin_cebra_fazenda_integration
      MYSQL_ROOT_HOST: "%"
    networks:
      default:
        aliases:
          - mysql
